name: Build & Release Windows Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run automated tests
        run: pytest -v

      - name: Build ClassroomTeacher.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ClassroomTeacher --paths . `
            --hidden-import qasync --hidden-import cryptography --hidden-import mss --hidden-import PIL `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtPdf --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            teacher_app/main.py

      - name: Build ClassroomStudent.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ClassroomStudent --paths . `
            --hidden-import qasync --hidden-import cryptography --hidden-import mss --hidden-import PIL `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtPdf --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            student_app/main.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomManager-Windows-EXE
          path: |
            dist/ClassroomTeacher.exe
            dist/ClassroomStudent.exe
            scripts/setup_firewall.ps1

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ClassroomTeacher.exe
            dist/ClassroomStudent.exe
            scripts/setup_firewall.ps1
